<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Santiago Apóstol Tequixquiac</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin-body">
    <!-- Login screen -->
    <div id="loginScreen" class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>🔐 Panel Administrativo</h1>
                <p>El Distintivo y Sección Santiago Apóstol Tequixquiac</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresa la contraseña" required autocomplete="current-password">
                    <span class="error-msg" id="error-login"></span>
                </div>
                <button type="submit" class="btn-submit">Iniciar Sesión</button>
            </form>
        </div>
    </div>

    <!-- Admin dashboard (hidden by default) -->
    <div id="dashboard" style="display:none;">
        <nav class="admin-nav">
            <div class="nav-title">
                <h2>📋 Panel de Registros</h2>
            </div>
            <div class="nav-actions">
                <button onclick="exportCSV()" class="btn-export">📥 Exportar CSV</button>
                <button onclick="logout()" class="btn-logout">Cerrar Sesión</button>
            </div>
        </nav>

        <main class="admin-container">
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-number" id="totalRegistros">0</span>
                    <span class="stat-label">Total de registros</span>
                </div>
            </div>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 Buscar por nombre..." oninput="filterTable()">
            </div>

            <div class="table-wrapper">
                <table id="registrosTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nombre Completo</th>
                            <th>Fecha Nacimiento</th>
                            <th>Fecha Ingreso</th>
                            <th>Celular</th>
                            <th>Tel. Emergencia</th>
                            <th>Fecha Registro</th>
                        </tr>
                    </thead>
                    <tbody id="registrosBody">
                        <!-- Rows inserted by JS -->
                    </tbody>
                </table>
                <p id="noResults" style="display:none;" class="no-results">No se encontraron registros.</p>
                <p id="loadingMsg" class="loading-msg">Cargando registros...</p>
            </div>
        </main>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
